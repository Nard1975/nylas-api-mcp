<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620">
  <defs>
    <!-- Sky gradient: deep indigo to warm amber -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#0d0828"/>
      <stop offset="35%"  style="stop-color:#3b1054"/>
      <stop offset="70%"  style="stop-color:#a0440e"/>
      <stop offset="100%" style="stop-color:#e8870a"/>
    </linearGradient>

    <!-- Kente cloth pattern: gold base with green/red/black strips -->
    <pattern id="kente" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#d4a017"/>
      <rect x="0"  y="0" width="12" height="6"  fill="#1e7a1e"/>
      <rect x="12" y="6" width="12" height="6"  fill="#c0392b"/>
      <rect x="0"  y="12" width="12" height="6" fill="#c0392b"/>
      <rect x="12" y="18" width="12" height="6" fill="#1e7a1e"/>
      <rect x="11" y="0"  width="2"  height="24" fill="#111"/>
      <rect x="0"  y="11" width="24" height="2"  fill="#111"/>
    </pattern>

    <!-- Kente border strip (narrower repeat) -->
    <pattern id="kenteStrip" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#d4a017"/>
      <rect x="0" y="0"  width="8" height="4" fill="#1e7a1e"/>
      <rect x="8" y="4"  width="8" height="4" fill="#c0392b"/>
      <rect x="0" y="8"  width="8" height="4" fill="#c0392b"/>
      <rect x="8" y="12" width="8" height="4" fill="#1e7a1e"/>
      <rect x="7" y="0"  width="2" height="16" fill="#111"/>
      <rect x="0" y="7"  width="16" height="2" fill="#111"/>
    </pattern>

    <!-- Skin tone gradients -->
    <radialGradient id="faceGrad" cx="50%" cy="38%" r="62%">
      <stop offset="0%"   style="stop-color:#a0663a"/>
      <stop offset="100%" style="stop-color:#6b3d1e"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   style="stop-color:#985e30"/>
      <stop offset="100%" style="stop-color:#5e3010"/>
    </radialGradient>

    <!-- Glow for the name text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000066"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ───────────────────────────────────────────── -->
  <rect width="480" height="620" fill="url(#bgGrad)"/>

  <!-- Faint moon -->
  <circle cx="380" cy="55" r="38" fill="#fffbe0" opacity="0.12"/>
  <circle cx="395" cy="45" r="38" fill="#0d0828"  opacity="0.12"/>

  <!-- Stars -->
  <circle cx="40"  cy="30" r="1.8" fill="#ffedb0" opacity="0.85"/>
  <circle cx="100" cy="18" r="1.4" fill="#ffedb0" opacity="0.7"/>
  <circle cx="160" cy="40" r="1.6" fill="#ffedb0" opacity="0.75"/>
  <circle cx="300" cy="22" r="1.8" fill="#ffedb0" opacity="0.8"/>
  <circle cx="360" cy="90" r="1.4" fill="#ffedb0" opacity="0.65"/>
  <circle cx="430" cy="32" r="1.6" fill="#ffedb0" opacity="0.75"/>
  <circle cx="460" cy="70" r="1.2" fill="#ffedb0" opacity="0.6"/>
  <circle cx="20"  cy="100" r="1.4" fill="#ffedb0" opacity="0.6"/>

  <!-- Horizon glow -->
  <ellipse cx="240" cy="620" rx="280" ry="90" fill="#e8870a" opacity="0.25"/>

  <!-- ── "Nia!" TITLE ──────────────────────────────────────────── -->
  <!-- Shadow layer -->
  <text x="243" y="107"
        font-family="Georgia, 'Palatino Linotype', Palatino, serif"
        font-size="68" font-weight="bold" font-style="italic"
        fill="#3b1054" opacity="0.55"
        text-anchor="middle" letter-spacing="4">Nia!</text>
  <!-- Main gold text -->
  <text x="240" y="104"
        font-family="Georgia, 'Palatino Linotype', Palatino, serif"
        font-size="68" font-weight="bold" font-style="italic"
        fill="#f5d020"
        text-anchor="middle" letter-spacing="4"
        filter="url(#glow)">Nia!</text>

  <!-- Decorative rule under name -->
  <line x1="110" y1="116" x2="370" y2="116" stroke="#d4a017" stroke-width="2" opacity="0.7"/>
  <circle cx="110" cy="116" r="4" fill="#d4a017" opacity="0.7"/>
  <circle cx="370" cy="116" r="4" fill="#d4a017" opacity="0.7"/>
  <circle cx="240" cy="116" r="4" fill="#d4a017" opacity="0.7"/>

  <!-- ── FIGURE ────────────────────────────────────────────────── -->

  <!-- Afro hair (behind head) -->
  <ellipse cx="240" cy="210" rx="88" ry="76" fill="#120800"/>
  <!-- Hair volume bumps -->
  <circle cx="172" cy="203" r="22" fill="#1c0e00"/>
  <circle cx="308" cy="203" r="22" fill="#1c0e00"/>
  <circle cx="188" cy="178" r="26" fill="#1c0e00"/>
  <circle cx="240" cy="168" r="28" fill="#1c0e00"/>
  <circle cx="292" cy="178" r="26" fill="#1c0e00"/>
  <circle cx="166" cy="225" r="18" fill="#1c0e00"/>
  <circle cx="314" cy="225" r="18" fill="#1c0e00"/>

  <!-- Gold headband/adornment -->
  <path d="M 168 215 Q 205 188 240 183 Q 275 188 312 215"
        stroke="#d4a017" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Headband gems -->
  <circle cx="168" cy="215" r="7"  fill="#d4a017" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="240" cy="183" r="10" fill="#d4a017" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="312" cy="215" r="7"  fill="#d4a017" stroke="#b8860b" stroke-width="1.5"/>
  <!-- Gem highlights -->
  <circle cx="237" cy="180" r="3" fill="#fffbe0" opacity="0.7"/>

  <!-- Neck -->
  <rect x="224" y="278" width="32" height="48" rx="8" fill="url(#faceGrad)"/>

  <!-- Gold necklace -->
  <path d="M 198 318 Q 240 332 282 318" stroke="#d4a017" stroke-width="4" fill="none"/>
  <circle cx="240" cy="334" r="7"  fill="#d4a017"/>
  <circle cx="222" cy="328" r="4"  fill="#d4a017"/>
  <circle cx="258" cy="328" r="4"  fill="#d4a017"/>
  <circle cx="205" cy="320" r="3"  fill="#d4a017"/>
  <circle cx="275" cy="320" r="3"  fill="#d4a017"/>

  <!-- Kente blouse / bodice -->
  <path d="M 148 330 Q 148 280 170 272 L 240 268 L 310 272 Q 332 280 332 330 L 332 420 L 148 420 Z"
        fill="url(#kente)" filter="url(#shadow)"/>

  <!-- Left arm -->
  <path d="M 152 320 Q 100 370 108 440" stroke="#7a4520" stroke-width="32"
        fill="none" stroke-linecap="round"/>
  <!-- Right arm -->
  <path d="M 328 320 Q 380 370 372 440" stroke="#7a4520" stroke-width="32"
        fill="none" stroke-linecap="round"/>

  <!-- Left hand -->
  <ellipse cx="108" cy="448" rx="19" ry="13" fill="#7a4520"/>
  <!-- Right hand -->
  <ellipse cx="372" cy="448" rx="19" ry="13" fill="#7a4520"/>

  <!-- Gold bangles -->
  <ellipse cx="118" cy="413" rx="20" ry="7" fill="none" stroke="#d4a017" stroke-width="4"/>
  <ellipse cx="118" cy="422" rx="20" ry="7" fill="none" stroke="#c8860b" stroke-width="3"/>
  <ellipse cx="362" cy="413" rx="20" ry="7" fill="none" stroke="#d4a017" stroke-width="4"/>
  <ellipse cx="362" cy="422" rx="20" ry="7" fill="none" stroke="#c8860b" stroke-width="3"/>

  <!-- Kente wrapper / skirt -->
  <path d="M 140 420 Q 120 440 118 560 L 362 560 Q 360 440 340 420 Z"
        fill="url(#kente)" filter="url(#shadow)"/>

  <!-- Skirt sash accent band -->
  <rect x="140" y="420" width="200" height="18" fill="#c0392b" opacity="0.5"/>
  <rect x="140" y="420" width="200" height="5"  fill="#d4a017" opacity="0.7"/>

  <!-- ── FACE ──────────────────────────────────────────────────── -->
  <!-- Head base -->
  <ellipse cx="240" cy="248" rx="64" ry="72" fill="url(#faceGrad)" filter="url(#shadow)"/>

  <!-- Eyebrows -->
  <path d="M 204 224 Q 215 218 228 222" stroke="#2a1000" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M 252 222 Q 265 218 276 224" stroke="#2a1000" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <!-- Left eye -->
  <ellipse cx="216" cy="238" rx="14" ry="10" fill="#140800"/>
  <ellipse cx="216" cy="237" rx="8"  ry="7"  fill="#2c1000"/>
  <circle  cx="221" cy="234" r="3"   fill="#fffbe0" opacity="0.9"/>
  <!-- Right eye -->
  <ellipse cx="264" cy="238" rx="14" ry="10" fill="#140800"/>
  <ellipse cx="264" cy="237" rx="8"  ry="7"  fill="#2c1000"/>
  <circle  cx="269" cy="234" r="3"   fill="#fffbe0" opacity="0.9"/>

  <!-- Upper lashes left -->
  <path d="M 203 232 Q 199 225 201 220" stroke="#140800" stroke-width="1.8" fill="none"/>
  <path d="M 208 229 Q 205 221 208 216" stroke="#140800" stroke-width="1.8" fill="none"/>
  <!-- Upper lashes right -->
  <path d="M 277 232 Q 281 225 279 220" stroke="#140800" stroke-width="1.8" fill="none"/>
  <path d="M 272 229 Q 275 221 272 216" stroke="#140800" stroke-width="1.8" fill="none"/>

  <!-- Nose -->
  <path d="M 233 252 Q 228 264 234 272 Q 240 276 246 272 Q 252 264 247 252"
        fill="#7a4020" stroke="#5a2c0e" stroke-width="1.2"/>
  <!-- Nostril highlight -->
  <circle cx="235" cy="270" r="3" fill="#5a2c0e" opacity="0.5"/>
  <circle cx="245" cy="270" r="3" fill="#5a2c0e" opacity="0.5"/>

  <!-- Lips -->
  <!-- Upper lip -->
  <path d="M 218 288 Q 228 282 240 284 Q 252 282 262 288
           Q 252 281 240 282 Q 228 281 218 288 Z"
        fill="#8b2020"/>
  <!-- Lower lip -->
  <path d="M 218 288 Q 226 298 240 300 Q 254 298 262 288
           Q 252 294 240 296 Q 228 294 218 288 Z"
        fill="#c0392b"/>
  <!-- Lip shine -->
  <ellipse cx="240" cy="295" rx="10" ry="3" fill="#d95a5a" opacity="0.35"/>

  <!-- Subtle cheek warmth -->
  <ellipse cx="196" cy="258" rx="18" ry="12" fill="#c0392b" opacity="0.15"/>
  <ellipse cx="284" cy="258" rx="18" ry="12" fill="#c0392b" opacity="0.15"/>

  <!-- Earrings -->
  <!-- Left -->
  <circle cx="178" cy="252" r="7"  fill="#d4a017" stroke="#b8860b" stroke-width="1.5"/>
  <path   d="M 178 259 L 171 278 L 185 278 Z" fill="#d4a017"/>
  <circle cx="178" cy="278" r="4"  fill="#f5d020"/>
  <!-- Right -->
  <circle cx="302" cy="252" r="7"  fill="#d4a017" stroke="#b8860b" stroke-width="1.5"/>
  <path   d="M 302 259 L 295 278 L 309 278 Z" fill="#d4a017"/>
  <circle cx="302" cy="278" r="4"  fill="#f5d020"/>

  <!-- ── KENTE BORDER BAND AT BOTTOM ──────────────────────────── -->
  <rect x="0" y="570" width="480" height="50" fill="url(#kenteStrip)" opacity="0.9"/>
  <line x1="0" y1="570" x2="480" y2="570" stroke="#d4a017" stroke-width="2.5"/>

  <!-- Decorative corner adornments -->
  <circle cx="20"  cy="590" r="8" fill="#d4a017" opacity="0.6"/>
  <circle cx="460" cy="590" r="8" fill="#d4a017" opacity="0.6"/>
</svg>
